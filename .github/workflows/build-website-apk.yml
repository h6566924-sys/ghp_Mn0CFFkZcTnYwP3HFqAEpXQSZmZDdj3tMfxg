name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        default: "My Website"
      package_name:
        description: "Android package name"
        required: true
        default: "com.example.mywebsite"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
                - name: Setup Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
          gradle-version: "8.10.2"
                - name: Prepare Android project
                  shell: bash
                  env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
                  run: |
          set -e
          rm -rf .apk-build apk-output
          mkdir -p ".apk-build/app/src/main/assets/site" ".apk-build/app/src/main/res/values" ".apk-build/app/src/main/res/drawable"
          PACKAGE_PATH="${PACKAGE_NAME//./\/}"
          mkdir -p ".apk-build/app/src/main/java/${PACKAGE_PATH}"
          cat > ".apk-build/settings.gradle" <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "WebsiteAPK"
          include(":app")
          GRADLE
          cat > ".apk-build/build.gradle" <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE
          cat > ".apk-build/app/build.gradle" <<GRADLE
          plugins { id 'com.android.application' }
          android {
              namespace "${PACKAGE_NAME}"
              compileSdk 35
              defaultConfig { applicationId "${PACKAGE_NAME}"; minSdk 23; targetSdk 35; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.13.0' }
          GRADLE
          cat > ".apk-build/app/src/main/res/values/strings.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">${APP_NAME}</string></resources>
          XML
          cat > ".apk-build/app/src/main/res/values/styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#00BCD4</item><item name="android:windowNoTitle">true</item></style></resources>
          XML
          cat > ".apk-build/app/src/main/AndroidManifest.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="${APP_NAME}" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:allowBackup="false" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > ".apk-build/app/src/main/java/${PACKAGE_PATH}/MainActivity.java" <<'JAVA'
          package __PACKAGE__;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 5001;
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setMediaPlaybackRequiresUserGesture(false);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  webView.setWebViewClient(new WebViewClient() {
            @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) { return loader.shouldInterceptRequest(req.getUrl()); }
            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) { String url=req.getUrl().toString(); if(url.startsWith("http://")||url.startsWith("https://")){ view.loadUrl(url); return true; } return false; }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
            @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                if(fileCallback!=null)fileCallback.onReceiveValue(null); fileCallback=callback;
                try { startActivityForResult(params.createIntent(), FILE_REQUEST); } catch(Exception e) { fileCallback=null; return false; }
                return true;
            }
                  });
                  setContentView(webView);
                  webView.loadUrl("https://appassets.androidplatform.net/assets/site/index.html");
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode==FILE_REQUEST){ Uri[] results=null; if(resultCode==RESULT_OK&&data!=null&&data.getData()!=null)results=new Uri[]{data.getData()}; if(fileCallback!=null){fileCallback.onReceiveValue(results);fileCallback=null;} }
              }
              @Override public void onBackPressed(){ if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed(); }
          }
          JAVA
          sed -i "s/__PACKAGE__/${PACKAGE_NAME}/g" ".apk-build/app/src/main/java/${PACKAGE_PATH}/MainActivity.java"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.apk-build' --exclude='apk-output' --exclude='node_modules' ./ .apk-build/app/src/main/assets/site/
          test -f .apk-build/app/src/main/assets/site/index.html
          cd .apk-build
          gradle --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p apk-output
          cp .apk-build/app/build/outputs/apk/debug/app-debug.apk "apk-output/website-${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: website-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
